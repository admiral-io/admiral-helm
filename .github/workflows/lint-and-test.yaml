name: Linting and Testing

on: pull_request

permissions:
  contents: read

jobs:
  linter-artifacthub:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1 # v6.0.2
      # From the GitHub release rather than the public.ecr.aws image, whose
      # anonymous pull quota is shared by every hosted runner on the same IP.
      - name: Install ah
        env:
          AH_VERSION: 1.20.0
          AH_SHA256: 9027626f19ff9f3ac668f222917130ac885e289e922e1428bfd2e7f066324e31
        run: |
          curl -fsSLo ah.tgz "https://github.com/artifacthub/hub/releases/download/v${AH_VERSION}/ah_${AH_VERSION}_linux_amd64.tar.gz"
          echo "${AH_SHA256}  ah.tgz" | sha256sum -c -
          tar -xzf ah.tgz -C "${RUNNER_TEMP}" ah
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Run ah lint
        working-directory: ./charts
        run: ah lint

  chart-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1 # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          check-latest: true
      - name: Setup chart linting
        id: lint
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: Add Helm repositories
        run: |
          helm repo add minio https://charts.min.io
          helm repo update
      - name: List changed charts
        id: list-changed
        run: |
          ## If executed with debug this won't work anymore.
          changed=$(ct --config ./.github/configs/ct-lint.yaml list-changed)
          charts=$(echo "$changed" | tr '\n' ' ' | xargs)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "changed_charts=$charts" >> $GITHUB_OUTPUT
          fi
      - name: Run chart-testing (lint)
        run: ct lint --debug --config ./.github/configs/ct-lint.yaml --lint-conf ./.github/configs/lintconf.yaml
      - name: Run docs-testing (helm-docs)
        id: helm-docs
        run: |
          ./scripts/helm-docs.sh
          if [[ $(git diff --stat) != '' ]]; then
            echo -e '\033[0;31mDocumentation outdated!\033[0m ❌'
            git diff --color
            exit 1
          else
            echo -e '\033[0;32mDocumentation up to date\033[0m ✔'
          fi
