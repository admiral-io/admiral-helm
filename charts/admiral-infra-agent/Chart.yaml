apiVersion: v2
name: admiral-infra-agent
description: Runs an Admiral agent in Kubernetes that plans and applies Terraform and OpenTofu components over an outbound-only connection.
home: https://admiral.io
icon: https://raw.githubusercontent.com/admiral-io/admiral-helm/master/assets/admiral-icon.svg
sources:
  - https://github.com/admiral-io/admiral-helm
keywords:
  - admiral
  - terraform
  - opentofu
  - agent
  - infrastructure-as-code
  - platform-engineering
type: application
version: 0.2.0
appVersion: v0.2.1
maintainers:
  - name: Admiral Contributors
    email: support@admiral.io
    url: https://github.com/admiral-io/admiral-helm
annotations:
  artifacthub.io/displayName: Admiral Infra Agent
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://admiral.io/docs?utm_source=artifacthub&utm_medium=referral&utm_campaign=admiral-infra-agent
    - name: Support
      url: https://github.com/admiral-io/admiral-community
  artifacthub.io/changes: |
    - kind: changed
      description: Agent v0.2.1
    - kind: added
      description: A component's input may reference another component's output, filled from the same job's plan or apply
    - kind: changed
      description: A failed component stops only the components that depend on it, and the rest still apply
    - kind: fixed
      description: A failed apply is reported as partial, with every component not reached listed as queued
    - kind: fixed
      description: An apply whose lease lapsed still reports what it did
    - kind: fixed
      description: Kubernetes client logs, such as leader election's, go through the agent's logger
