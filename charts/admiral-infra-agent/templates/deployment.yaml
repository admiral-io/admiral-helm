{{- include "admiral-infra-agent.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "admiral-infra-agent.fullname" . }}
  labels:
    {{- include "admiral-infra-agent.labels" . | nindent 4 }}
spec:
  # One agent per release, however many pods. Its pods elect a leader
  # through a Lease, and only the leader claims jobs.
  replicas: {{ .Values.replicas }}
  strategy:
    {{- if .Values.persistence.enabled }}
    # A ReadWriteOnce claim cannot follow a new pod until the old one lets
    # go, so the old pod drains and stops first.
    type: Recreate
    {{- else }}
    # The new pod starts first and stands by, and the old one drains and
    # stops once the new one is ready.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "admiral-infra-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.config .Values.podAnnotations }}
      annotations:
        {{- if .Values.config }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "admiral-infra-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "admiral-infra-agent.serviceAccountName" . }}
      # The agent reaches the Kubernetes API with the in-cluster service-account
      # token, to read the cluster's UID and hold its Lease.
      automountServiceAccountToken: true
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # shutdownDrain, then up to 5 minutes for an apply past it to stop
      # before its next component and write state.
      terminationGracePeriodSeconds: {{ add (include "admiral-infra-agent.shutdownDrainSeconds" . | atoi) 300 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- include "admiral-infra-agent.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ include "admiral-infra-agent.version" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            {{- if .Values.verbose }}
            - --verbose
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: ADMIRAL_SERVER
              value: {{ .Values.admiral.server | quote }}
            - name: ADMIRAL_SERVICE_ACCOUNT_ID
              value: {{ .Values.admiral.serviceAccountId | quote }}
            - name: ADMIRAL_INSECURE
              value: {{ .Values.admiral.insecure | quote }}
            - name: ADMIRAL_TOKEN_FILE
              value: /var/run/secrets/admiral/token
            - name: ADMIRAL_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ADMIRAL_LEADER_ELECT
              value: {{ include "admiral-infra-agent.leaderElect" . | quote }}
            - name: ADMIRAL_DATA_DIR
              value: /var/lib/admiral
            - name: ADMIRAL_PLAN_CONCURRENCY
              value: {{ .Values.planConcurrency | quote }}
            - name: ADMIRAL_APPLY_CONCURRENCY
              value: {{ .Values.applyConcurrency | quote }}
            # The same value sets terminationGracePeriodSeconds above.
            - name: ADMIRAL_SHUTDOWN_DRAIN
              value: {{ .Values.shutdownDrain | quote }}
            - name: ADMIRAL_MAX_ARTIFACT_MIB
              value: {{ .Values.maxArtifactMiB | quote }}
            - name: ADMIRAL_HEALTH_ADDR
              value: ":8081"
            - name: ADMIRAL_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            {{- if .Values.config }}
            - name: ADMIRAL_CONFIG_FILE
              value: /etc/admiral/config/config.json
            {{- end }}
            {{- if .Values.admiral.ca.configMap }}
            - name: ADMIRAL_CA_FILE
              value: /etc/admiral/ca/{{ .Values.admiral.ca.key }}
            {{- end }}
            {{- if .Values.enrollment.existingSecret }}
            - name: ADMIRAL_ENROLLMENT_KEY_FILE
              value: /var/run/secrets/admiral-enrollment/{{ .Values.enrollment.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- include "admiral-infra-agent.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- include "admiral-infra-agent.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          ports:
            # /healthz, /readyz and /metrics
            - name: http
              containerPort: 8081
              protocol: TCP
          # Fails only when a loop has stopped turning, so an outage makes
          # the agent not ready rather than restarting it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # The leader is ready once its status reaches Admiral; a standby
          # once it can read the Lease and is connected to Admiral.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: admiral-token
              mountPath: /var/run/secrets/admiral
              readOnly: true
            - name: data
              mountPath: /var/lib/admiral
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config }}
            - name: config
              mountPath: /etc/admiral/config
              readOnly: true
            {{- end }}
            {{- if .Values.enrollment.existingSecret }}
            - name: admiral-enrollment
              mountPath: /var/run/secrets/admiral-enrollment
              readOnly: true
            {{- end }}
            {{- if .Values.admiral.ca.configMap }}
            - name: admiral-ca
              mountPath: /etc/admiral/ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- include "admiral-infra-agent.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
      volumes:
        # The agent's identity to Admiral: a short-lived token the kubelet
        # issues for Admiral's audience and rotates.
        - name: admiral-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.admiral.audience | quote }}
                  expirationSeconds: 3600
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "admiral-infra-agent.claimName" . }}
          {{- else if .Values.persistence.sizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.persistence.sizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "admiral-infra-agent.fullname" . }}
        {{- end }}
        {{- if .Values.enrollment.existingSecret }}
        # Optional, so the pod still starts after the spent key's Secret is
        # deleted.
        - name: admiral-enrollment
          secret:
            secretName: {{ .Values.enrollment.existingSecret }}
            optional: true
        {{- end }}
        {{- if .Values.admiral.ca.configMap }}
        - name: admiral-ca
          configMap:
            name: {{ .Values.admiral.ca.configMap }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- include "admiral-infra-agent.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
