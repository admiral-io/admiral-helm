{{- if .Values.networkPolicy.enabled }}
{{- $port := regexFind "[0-9]+$" (regexFind ":[0-9]+$" .Values.admiral.server) | default "443" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "admiral-infra-agent.fullname" . }}
  labels:
    {{- include "admiral-infra-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "admiral-infra-agent.selectorLabels" . | nindent 6 }}
  # Egress only. Inbound traffic is limited to health checks and metrics
  # scrapes.
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS: OpenTofu releases, provider registries, state backends and cloud
    # APIs. Also the Kubernetes API server, whose own port policies see is
    # often 6443 behind the kubernetes Service's 443.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- if ne $port "443" }}
    # Admiral, on the port in admiral.server
    - ports:
        - port: {{ $port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
