{{- if .Values.rbac.create }}
{{- $name := include "admiral-infra-agent.clusterScopedName" . }}
{{- $sa := include "admiral-infra-agent.serviceAccountName" . }}
# Lets the agent read the kube-system namespace's UID at startup, which it
# sends to Admiral so Admiral can tell which cluster it runs in. Nothing
# else cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "admiral-infra-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "admiral-infra-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# Lets the agent read the keys the cluster signs service-account tokens with
# (/openid/v1/jwks). Enrollment sends them, and status reports include them.
# Kubernetes grants this to every service account by default; the binding
# keeps it working where that default was removed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-issuer-discovery
  labels:
    {{- include "admiral-infra-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- if eq (include "admiral-infra-agent.leaderElect" .) "true" }}
---
# Lets the agent's pods elect a leader through the Lease
# admiral-infra-agent-<service account id> in the release namespace.
# Kubernetes cannot limit create to one name, so the rule covers every Lease
# in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "admiral-infra-agent.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "admiral-infra-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "admiral-infra-agent.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "admiral-infra-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "admiral-infra-agent.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
