apiVersion: v2
name: admiral-k8s-agent
description: Runs an Admiral agent in Kubernetes over an outbound-only connection, and plans and applies changes with server-side apply.
home: https://admiral.io
icon: https://raw.githubusercontent.com/admiral-io/admiral-helm/master/assets/admiral-icon.svg
sources:
  - https://github.com/admiral-io/admiral-helm
keywords:
  - admiral
  - kubernetes
  - agent
  - deployment
  - platform-engineering
  - continuous-delivery
type: application
version: 0.11.0
appVersion: v0.6.0
maintainers:
  - name: Admiral Contributors
    email: support@admiral.io
    url: https://github.com/admiral-io/admiral-helm
annotations:
  artifacthub.io/displayName: Admiral Kubernetes Agent
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://admiral.io/docs?utm_source=artifacthub&utm_medium=referral&utm_campaign=admiral-k8s-agent
    - name: Support
      url: https://github.com/admiral-io/admiral-community
  artifacthub.io/changes: |
    - kind: changed
      description: Agent v0.6.0
    - kind: changed
      description: A component whose objects were all written but which did not become healthy is reported unhealthy, and Admiral no longer holds the environment for it. Stopping the health wait reports the same way
    - kind: changed
      description: A failed component stops only the components that depend on it, and the rest still apply
    - kind: added
      description: The health wait ends at once on a failed Pod or Job, a Deployment past its progress deadline, or an image that does not exist, and keeps waiting on a missing Secret
    - kind: added
      description: While it waits, the job log shows restart counts, Warning events, and the last 20 lines a crashed container wrote. The chart grants list on events and get on pods/log; without either, the agent leaves that detail out
    - kind: added
      description: A plan names every Role and binding the agent may not create, in one pass
    - kind: fixed
      description: A hand-added kubectl annotate or label survives the next apply
    - kind: fixed
      description: The immutable-field check no longer matches on an object's name
    - kind: fixed
      description: Enrollment retries when it cannot reach Admiral, and stops only when Admiral refuses the key
    - kind: fixed
      description: An apply whose lease lapses finishes the write in hand and stops before the next object, and a lease lost during shutdown stops running jobs
