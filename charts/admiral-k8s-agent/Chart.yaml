  - deployment
  - platform-engineering
  - continuous-delivery
type: application
version: 0.10.0
appVersion: v0.4.0
maintainers:
  - name: Admiral Contributors
    email: support@admiral.io
    url: https://github.com/admiral-io/admiral-helm
annotations:
  artifacthub.io/displayName: Admiral Kubernetes Agent
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://admiral.io/docs?utm_source=artifacthub&utm_medium=referral&utm_campaign=admiral-k8s-agent
    - name: Support
      url: https://github.com/admiral-io/admiral-community
  artifacthub.io/changes: |
    - kind: changed
      description: appVersion v0.4.0, which speaks a new agent protocol and needs an Admiral that speaks it too
    - kind: changed
      description: Before each plan the agent checks its own permissions with SelfSubjectAccessReview, which Kubernetes grants every authenticated identity, so the chart's RBAC is unchanged
    - kind: changed
      description: A plan lists an object Admiral did not create as a takeover, and the apply takes it over once approved. The admiral.io/adopt annotation no longer has an effect
