apiVersion: v2
name: admiral-k8s-agent
description: Runs an Admiral agent in Kubernetes over an outbound-only connection, and plans and applies changes with server-side apply.
home: https://admiral.io
icon: https://raw.githubusercontent.com/admiral-io/admiral-helm/master/assets/admiral-icon.svg
sources:
  - https://github.com/admiral-io/admiral-helm
keywords:
  - admiral
  - kubernetes
  - agent
  - deployment
  - platform-engineering
  - continuous-delivery
type: application
version: 0.9.0
appVersion: v0.2.0
maintainers:
  - name: Admiral Contributors
    email: support@admiral.io
    url: https://github.com/admiral-io/admiral-helm
annotations:
  artifacthub.io/displayName: Admiral Kubernetes Agent
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://admiral.io/docs?utm_source=artifacthub&utm_medium=referral&utm_campaign=admiral-k8s-agent
    - name: Support
      url: https://github.com/admiral-io/admiral-community
  artifacthub.io/changes: |
    - kind: changed
      description: admiral.serviceAccountId (ADMIRAL_SERVICE_ACCOUNT_ID) replaces admiral.agentId
    - kind: changed
      description: admiral.server defaults to api.admiral.io:443
    - kind: added
      description: A Role and RoleBinding let the agent's pods elect a leader through a Lease in the release namespace
    - kind: added
      description: The replicas and leaderElect values, so an agent can run a standby pod
    - kind: fixed
      description: helm upgrade no longer fails under Helm 4's server-side apply with a conflict on the aggregated ClusterRole's rules
