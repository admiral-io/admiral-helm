apiVersion: v2
name: admiral-k8s-agent
description: Connects a Kubernetes cluster to Admiral over an outbound-only connection, and plans and applies changes with server-side apply.
home: https://admiral.io
icon: https://raw.githubusercontent.com/admiral-io/admiral-helm/master/assets/admiral-icon.svg
sources:
  - https://github.com/admiral-io/admiral-helm
keywords:
  - admiral
  - kubernetes
  - agent
  - deployment
  - platform-engineering
  - continuous-delivery
type: application
version: 0.7.0
appVersion: v0.1.0
maintainers:
  - name: Admiral Contributors
    email: support@admiral.io
    url: https://github.com/admiral-io/admiral-helm
annotations:
  artifacthub.io/displayName: Admiral Kubernetes Agent
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://admiral.io/docs?utm_source=artifacthub&utm_medium=referral&utm_campaign=admiral-k8s-agent
    - name: Support
      url: https://github.com/admiral-io/admiral-community
  artifacthub.io/changes: |
    - kind: security
      description: The default rules name each built-in kind instead of granting every resource, and the cluster-wide ClusterRole is aggregated, so custom resources are added with a labeled ClusterRole
    - kind: changed
      description: Upgrades roll the new pod out before stopping the old one, instead of Recreate
    - kind: changed
      description: The enrollment key is mounted as a file (ADMIRAL_ENROLLMENT_KEY_FILE) instead of an environment variable
    - kind: changed
      description: Default resources with a 1Gi memory limit, a linux nodeSelector, and JSON logs
    - kind: added
      description: allowedNamespaces, maxArtifactSize, kubeQPS, kubeBurst, logFormat and admiral.ca
