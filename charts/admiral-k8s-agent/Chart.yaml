apiVersion: v2
name: admiral-k8s-agent
description: Runs an Admiral agent in Kubernetes over an outbound-only connection, and plans and applies changes with server-side apply.
home: https://admiral.io
icon: https://raw.githubusercontent.com/admiral-io/admiral-helm/master/assets/admiral-icon.svg
sources:
  - https://github.com/admiral-io/admiral-helm
keywords:
  - admiral
  - kubernetes
  - agent
  - deployment
  - platform-engineering
  - continuous-delivery
type: application
version: 0.10.2
appVersion: v0.4.3
maintainers:
  - name: Admiral Contributors
    email: support@admiral.io
    url: https://github.com/admiral-io/admiral-helm
annotations:
  artifacthub.io/displayName: Admiral Kubernetes Agent
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Documentation
      url: https://admiral.io/docs?utm_source=artifacthub&utm_medium=referral&utm_campaign=admiral-k8s-agent
    - name: Support
      url: https://github.com/admiral-io/admiral-community
  artifacthub.io/changes: |
    - kind: fixed
      description: appVersion v0.4.3. An apply that creates a Job, or an object a webhook or the API server stamps with made-up values on each dry run, is no longer refused for a plan that changed
    - kind: fixed
      description: An update's and a takeover's plan count only the fields the apply changes, so a webhook's fresh stamp no longer refuses the apply
    - kind: changed
      description: A custom resource is not healthy until its controller writes a status, when its CRD declares one, or while its Ready condition describes an earlier generation. admiral.io/health-check disabled opts any object out of the wait. The chart's RBAC already grants get on CRDs
    - kind: changed
      description: Pruning leaves in place an object held by a finalizer that is not Kubernetes' own, unless it is annotated admiral.io/prune "true"
    - kind: added
      description: The agent takes over the fields of Argo CD, Flux, Pulumi and Terraform, and --take-over-field-managers names more
