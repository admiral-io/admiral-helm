{{- include "admiral-k8s-agent.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "admiral-k8s-agent.fullname" . }}
  labels:
    {{- include "admiral-k8s-agent.labels" . | nindent 4 }}
spec:
  # One agent per release. An upgrade starts the new pod first and stops the
  # old one once the new one is ready, which takes a status report reaching
  # Admiral, so a new pod that cannot reach Admiral leaves the old one
  # running. Until then both claim work as the same agent; each job attempt
  # runs under a lease in one pod only.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "admiral-k8s-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "admiral-k8s-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "admiral-k8s-agent.serviceAccountName" . }}
      # The agent reaches the Kubernetes API with the in-cluster service-account token.
      automountServiceAccountToken: true
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ add (include "admiral-k8s-agent.shutdownDrainSeconds" . | atoi) 5 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            {{- if .Values.verbose }}
            - --verbose
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: ADMIRAL_SERVER
              value: {{ .Values.admiral.server | quote }}
            - name: ADMIRAL_SERVICE_ACCOUNT_ID
              value: {{ .Values.admiral.serviceAccountId | quote }}
            - name: ADMIRAL_INSECURE
              value: {{ .Values.admiral.insecure | quote }}
            - name: ADMIRAL_TOKEN_FILE
              value: /var/run/secrets/admiral/token
            - name: ADMIRAL_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ADMIRAL_PLAN_CONCURRENCY
              value: {{ .Values.planConcurrency | quote }}
            - name: ADMIRAL_APPLY_CONCURRENCY
              value: {{ .Values.applyConcurrency | quote }}
            - name: ADMIRAL_APPLY_HEALTH_TIMEOUT
              value: {{ .Values.applyHealthTimeout | quote }}
            - name: ADMIRAL_SHUTDOWN_DRAIN
              value: {{ .Values.shutdownDrain | quote }}
            - name: ADMIRAL_HEALTH_ADDR
              value: ":8081"
            - name: ADMIRAL_MAX_ARTIFACT_SIZE
              value: {{ .Values.maxArtifactSize | default "16Mi" | quote }}
            - name: ADMIRAL_KUBE_QPS
              value: {{ .Values.kubeQPS | default 50 | quote }}
            - name: ADMIRAL_KUBE_BURST
              value: {{ .Values.kubeBurst | default 100 | quote }}
            - name: ADMIRAL_LOG_FORMAT
              value: {{ include "admiral-k8s-agent.logFormat" . | quote }}
            {{- with .Values.allowedNamespaces }}
            - name: ADMIRAL_ALLOWED_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if include "admiral-k8s-agent.caConfigMap" . }}
            - name: ADMIRAL_CA_FILE
              value: /etc/admiral/ca/{{ include "admiral-k8s-agent.caKey" . }}
            {{- end }}
            {{- if .Values.enrollment.existingSecret }}
            - name: ADMIRAL_ENROLLMENT_KEY_FILE
              value: /var/run/secrets/admiral-enrollment/{{ .Values.enrollment.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- include "admiral-k8s-agent.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          # Fails only when a loop has not turned for 10 minutes, so an outage
          # makes the agent not ready rather than restarting it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          # Fails until the first status report reaches Admiral, then after
          # three reports in a row fail, or three reads of the Kubernetes API.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: admiral-token
              mountPath: /var/run/secrets/admiral
              readOnly: true
            {{- if .Values.enrollment.existingSecret }}
            - name: admiral-enrollment
              mountPath: /var/run/secrets/admiral-enrollment
              readOnly: true
            {{- end }}
            {{- if include "admiral-k8s-agent.caConfigMap" . }}
            - name: admiral-ca
              mountPath: /etc/admiral/ca
              readOnly: true
            {{- end }}
      volumes:
        # The agent's identity to Admiral: a short-lived token the kubelet
        # issues for Admiral's audience and rotates.
        - name: admiral-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.admiral.audience | quote }}
                  expirationSeconds: 3600
        {{- if .Values.enrollment.existingSecret }}
        # Optional, so the pod still starts after the spent key's Secret is
        # deleted.
        - name: admiral-enrollment
          secret:
            secretName: {{ .Values.enrollment.existingSecret }}
            optional: true
        {{- end }}
        {{- if include "admiral-k8s-agent.caConfigMap" . }}
        - name: admiral-ca
          configMap:
            name: {{ include "admiral-k8s-agent.caConfigMap" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
