{{- if .Values.networkPolicy.enabled }}
{{- $port := regexFind "[0-9]+$" (regexFind ":[0-9]+$" .Values.admiral.server) | default "443" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "admiral-k8s-agent.fullname" . }}
  labels:
    {{- include "admiral-k8s-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "admiral-k8s-agent.selectorLabels" . | nindent 6 }}
  # Egress only. Inbound traffic is limited to the kubelet's health checks.
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API server. Policies see the API server's own port, which is
    # often 6443 behind the kubernetes Service's 443.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Admiral, on the port in admiral.server
    - ports:
        - port: {{ $port }}
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
