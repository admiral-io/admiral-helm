# Default values for admiral-k8s-agent.
# This is a YAML-formatted file.
#
# The chart runs one agent as a single replica. To run several agents in one
# cluster, install the chart once per agent, each in its own namespace.

# -- Container image configuration
image:
  # -- Image repository
  repository: ghcr.io/admiral-io/admiral-k8s-agent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# =============================================================================
# Admiral
# =============================================================================

# -- How the agent reaches Admiral and which agent it is.
admiral:
  # -- Admiral's address (`host:port`). Sets `ADMIRAL_SERVER`. Required.
  server: ""
  # -- The agent in Admiral this release runs as, an `agt-` id. Admiral checks
  # the service-account token against that agent's provider and subject. Sets
  # `ADMIRAL_AGENT_ID`. Required.
  agentId: ""
  # -- Audience of the projected service-account token the agent presents to
  # Admiral. It must match the audience your Admiral installation expects.
  audience: admiral.io
  # -- Connect to Admiral without TLS. For local development only: the agent
  # warns at start and will not enroll this way. Sets `ADMIRAL_INSECURE`.
  insecure: false
  # -- Trust a private certificate authority for Admiral, beside the
  # system's. Names a ConfigMap in the release namespace holding PEM
  # certificates. Sets `ADMIRAL_CA_FILE`.
  ca:
    # -- Name of the ConfigMap. Empty trusts the system's authorities only.
    configMap: ""
    # -- Key within the ConfigMap that holds the certificates.
    key: ca.crt

# -- Enrollment sends the cluster's service-account signing keys to Admiral
# once, for a cluster whose keys Admiral cannot fetch (a private cluster, or
# kind). Create a single-use enrollment key in Admiral, store it in a Secret in
# the release namespace, and name that Secret here. The key is spent on first
# use. You can delete the Secret afterwards, and the agent still starts.
enrollment:
  # -- Name of a Secret holding the enrollment key. Empty means the agent does
  # not enroll.
  existingSecret: ""
  # -- Key within `existingSecret` that holds the enrollment key. The key is
  # mounted as a file, so it does not show in the pod's environment. Sets
  # `ADMIRAL_ENROLLMENT_KEY_FILE`.
  existingSecretKey: key

# =============================================================================
# RBAC
# =============================================================================

# -- What the agent may do in the cluster. A plan reads live objects and runs a
# server-side apply dry run; an apply does the same for real. Kubernetes
# authorizes either as a patch for an object that exists and a create for one
# that does not. An apply also deletes: objects a component no longer renders,
# finished hooks, and objects it replaces. So the agent needs `get`, `patch`,
# `create` and `delete` on every kind it manages, and `watch` on the Jobs and
# Pods it runs as hooks.
rbac:
  # -- Create the RBAC objects. Set false to bind the service account yourself.
  create: true
  # -- Namespaces the agent may deploy to. Empty grants the rules in every
  # namespace through one aggregated ClusterRole. To manage a custom resource
  # then, add a ClusterRole for its group labeled
  # `admiral.io/aggregate-to-agent: "true"`. When set, the chart creates a Role and
  # RoleBinding in each listed namespace, plus a small ClusterRole that lets
  # the agent get the `kube-system` namespace (it reports that namespace's UID
  # at startup) and list namespaces (to find where it may write). The listed
  # namespaces must already exist.
  namespaces: []
  # -- Rules for the ClusterRole, or for each Role when `namespaces` is set.
  # Empty grants `get`, `patch`, `create` and `delete` on the built-in kinds
  # most charts render, each named, with no wildcard, and `watch` on Jobs and
  # Pods, which lets an apply see a hook finish even when its TTL deletes it
  # at once. Replaces the default entirely; values are not merged. Rules
  # without `watch` work, and the agent polls hooks instead.
  rules: []
    # - apiGroups: [""]
    #   resources: ["configmaps", "secrets", "services"]
    #   verbs: ["get", "patch", "create", "delete"]
    # - apiGroups: ["apps"]
    #   resources: ["deployments"]
    #   verbs: ["get", "patch", "create", "delete"]

# -- Service account the agent runs as. Its projected token is the agent's
# identity to Admiral.
serviceAccount:
  # -- Create a service account
  create: true
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""
  # -- Annotations to add to the service account
  annotations: {}

# =============================================================================
# Agent
# =============================================================================

# -- How many plans the agent runs at once, from 1 to 64. Sets
# `ADMIRAL_PLAN_CONCURRENCY`.
planConcurrency: 2

# -- How many applies the agent runs at once, from 1 to 64. Sets
# `ADMIRAL_APPLY_CONCURRENCY`.
applyConcurrency: 1

# -- How long one component's objects, and each of its hooks, may take to
# become ready during an apply. Sets `ADMIRAL_APPLY_HEALTH_TIMEOUT`. Write it
# in hours, minutes and seconds (`5m`, `1h`).
applyHealthTimeout: 5m

# -- How long running work may finish after the pod is asked to stop. Sets
# `ADMIRAL_SHUTDOWN_DRAIN`. Write it in hours, minutes and seconds (`25s`,
# `1m30s`). The pod's termination grace period is set 5 seconds above it.
shutdownDrain: 25s

# -- The only namespaces plans and applies may read or write. A plan or apply
# that touches another namespace fails. Empty means any namespace the agent's
# RBAC allows. Sets `ADMIRAL_ALLOWED_NAMESPACES`.
allowedNamespaces: []

# -- The most a job's artifact may expand to, from `1Mi` to `512Mi`. A larger
# artifact fails its job. A plan holds about 16 times this, so raise the memory
# limit with it. Sets `ADMIRAL_MAX_ARTIFACT_SIZE`.
maxArtifactSize: 16Mi

# -- Requests per second the agent sends the Kubernetes API, shared by all its
# jobs. Sets `ADMIRAL_KUBE_QPS`.
kubeQPS: 50

# -- Requests the agent may send at once above `kubeQPS`. Sets
# `ADMIRAL_KUBE_BURST`.
kubeBurst: 100

# -- Log format, `json` or `text`. Sets `ADMIRAL_LOG_FORMAT`.
logFormat: json

# -- Log at debug level. Adds `--verbose`.
verbose: false

# -- Extra arguments appended to the agent's `run` command
extraArgs: []

# -- Extra environment variables for the agent container. The agent honors
# `HTTPS_PROXY`.
extraEnv: []
  # - name: HTTPS_PROXY
  #   value: http://proxy.example.com:3128

# =============================================================================
# Pod
# =============================================================================

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context. Meets the Kubernetes restricted Pod Security
# Standard. The image runs as uid and gid 65532.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# -- Resource requests and limits. The 1Gi limit covers two plans and an apply
# at the default `maxArtifactSize`. To accept larger artifacts or run more jobs
# at once, raise it by 16 times the extra size for each job slot. The agent
# sets Go's soft memory limit to 90% of the container's.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 1Gi

# -- Node selector for pod assignment. The image is built for Linux only.
nodeSelector:
  kubernetes.io/os: linux

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# -- Priority class for the pod
priorityClassName: ""

# =============================================================================
# Network Policy
# =============================================================================

# -- NetworkPolicy that limits the agent's outbound traffic to DNS (port 53),
# the Kubernetes API server (ports 443 and 6443, since many clusters serve the
# API on 6443 behind the `kubernetes` Service), and Admiral (the port in
# `admiral.server`, 443 when none is given). The rules match by port only,
# because the chart cannot know the addresses behind them. Inbound traffic is
# left alone: the agent accepts none except its health checks.
networkPolicy:
  # -- Create the NetworkPolicy
  enabled: false
  # -- Additional egress rules, for example to reach an HTTPS proxy
  extraEgress: []
