    version: 0.7.1
  - annotations:
      artifacthub.io/category: integration-delivery
      artifacthub.io/changes: |
        - kind: security
          description: The default rules name each built-in kind instead of granting every resource, and the cluster-wide ClusterRole is aggregated, so custom resources are added with a labeled ClusterRole
        - kind: changed
          description: Upgrades roll the new pod out before stopping the old one, instead of Recreate
        - kind: changed
          description: The enrollment key is mounted as a file (ADMIRAL_ENROLLMENT_KEY_FILE) instead of an environment variable
        - kind: changed
          description: Default resources with a 1Gi memory limit, a linux nodeSelector, and JSON logs
        - kind: added
          description: allowedNamespaces, maxArtifactSize, kubeQPS, kubeBurst, logFormat and admiral.ca
      artifacthub.io/displayName: Admiral Kubernetes Agent
