apiVersion: v1
entries:
  admiral-k8s-agent:
  - annotations:
      artifacthub.io/category: integration-delivery
      artifacthub.io/changes: |
        - kind: added
          description: A Role and RoleBinding let the agent's pods elect a leader through a Lease in the release namespace
        - kind: added
          description: The replicas and leaderElect values, so an agent can run a standby pod
        - kind: fixed
          description: helm upgrade no longer fails under Helm 4's server-side apply with a conflict on the aggregated ClusterRole's rules
      artifacthub.io/displayName: Admiral Kubernetes Agent
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://admiral.io/docs?utm_source=artifacthub&utm_medium=referral&utm_campaign=admiral-k8s-agent
        - name: Support
          url: https://github.com/admiral-io/admiral-community
