  admiral-k8s-agent:
  - annotations:
      artifacthub.io/category: integration-delivery
      artifacthub.io/changes: |
        - kind: added
          description: Artifact Hub lists the agent image, which is public on GHCR
      artifacthub.io/displayName: Admiral Kubernetes Agent
      artifacthub.io/images: |
        - name: admiral-k8s-agent
          image: ghcr.io/admiral-io/admiral-k8s-agent:v0.6.0
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://admiral.io/docs?utm_source=artifacthub&utm_medium=referral&utm_campaign=admiral-k8s-agent
        - name: Support
